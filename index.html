<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>실시간 소음(dB) 측정기</title>
  <!-- UI 스타일링을 위한 Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body class="bg-gray-950 text-white font-sans select-none min-h-screen flex flex-col justify-start">

  <!-- 타이틀 바 (최상단 밀착) -->
  <header class="bg-gray-900 border-b border-gray-800 py-2 px-3 text-center">
    <h1 class="text-lg font-extrabold text-emerald-400 tracking-tight flex items-center justify-center gap-1">
      <span>🔊</span> 데시벨 측정기
    </h1>
  </header>

  <!-- 메인 컨텐츠 영역 (컴팩트 레이아웃) -->
  <main class="w-full max-w-md mx-auto p-2 flex flex-col gap-2">
    
    <!-- 상단 영역: 데시벨(좌) + 버튼(우) -->
    <div class="flex items-center gap-2 bg-gray-900 p-2 rounded-xl border border-gray-800 shadow-md">
      <!-- 왼쪽: 실시간 데시벨 (원형 크기 최적화) -->
      <div class="relative flex-shrink-0 flex items-center justify-center w-24 h-24 bg-gray-800 rounded-full border-4 border-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.15)]">
        <div id="db-display" class="text-2xl font-black text-emerald-400 tracking-wider">
          00 <span class="text-xs font-normal text-gray-500">dB</span>
        </div>
      </div>

      <!-- 오른쪽: 제어 버튼 및 상태 바 -->
      <div class="flex-grow flex flex-col gap-1.5">
        <button id="start-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-extrabold py-2 px-3 rounded-lg transition duration-200 cursor-pointer text-sm active:scale-[0.98]">
          측정 시작
        </button>
        <p id="status" class="text-gray-400 text-[10px] font-medium leading-tight px-0.5">
          버튼을 누르면 측정이 시작되며 화면이 꺼지지 않습니다.
        </p>
        <div class="w-full bg-gray-800 rounded-full h-2 overflow-hidden p-[1px] border border-gray-700">
          <div id="progress-bar" class="bg-emerald-500 h-full w-0 rounded-full transition-all duration-75"></div>
        </div>
      </div>
    </div>

    <!-- 하단 영역: 기록 및 통계 대시보드 (기록 버튼 밀착형 구조) -->
    <div class="bg-gray-900 border border-gray-800 p-2 rounded-xl shadow-md flex flex-col">
      <h2 class="text-xs font-bold text-gray-400 mb-1.5 flex items-center gap-1">
        📊 기록 구간 실시간 통계
      </h2>
      
      <!-- 실시간 통계 지표가 들어가는 공간 (화면 맞춤 고정 높이) -->
      <div id="record-status" class="text-gray-400 mb-2 text-xs bg-gray-950 p-2 rounded-lg border border-gray-800 min-h-[110px] flex flex-col justify-center font-sans">
        <div class="text-center text-gray-500 py-4">대기 중... (측정을 시작하면 활성화됩니다.)</div>
      </div>
      
      <!-- 제어 버튼 (통계 창 바로 아래 배치) -->
      <div class="flex gap-2">
        <button id="record-btn" disabled class="flex-1 bg-gray-800 text-gray-600 font-bold py-2.5 px-3 rounded-lg transition duration-200 cursor-not-allowed text-xs">
          기록 시작
        </button>
        <button id="stop-btn" disabled class="flex-1 bg-gray-600 text-gray-400 font-bold py-2.5 px-3 rounded-lg transition duration-200 cursor-not-allowed text-xs">
          기록 중지
        </button>
      </div>
    </div>
  </main>

  <!-- 🚨 커스텀 모달 UI -->
  <div id="custom-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl max-w-xs w-full text-center shadow-2xl transform scale-95 transition-transform duration-200">
      <div id="modal-icon" class="text-2xl mb-1">📊</div>
      <h3 id="modal-title" class="text-base font-bold text-white mb-2">측정 결과</h3>
      <div id="modal-message" class="text-xs text-gray-400 mb-4 text-left space-y-2 leading-tight"></div>
      <button id="modal-close-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-bold py-2 px-3 rounded-lg transition cursor-pointer active:scale-95 text-xs">
        확인
      </button>
    </div>
  </div>

  <script>
    let audioContext;
    let analyser;
    let microphone;
    let isMeasuring = false;
    let wakeLock = null;

    // 기록용 무제한 통계 변수 (O(1) 메모리 설계)
    let isRecording = false;
    let maxDb = 0;
    let maxDbTime = '-';
    let minDb = 999;
    let minDbTime = '-';
    let totalDbSum = 0;
    let sampleCount = 0;
    
    let maxDbLat = '측정중', maxDbLng = '측정중';
    let ignoreClickNoise = false;
    let startTime = '';
    let endTime = '';
    let recordRealStartTime = 0;

    let currentLat = null;
    let currentLng = null;
    let geoWatchId = null;

    const startBtn = document.getElementById('start-btn');
    const recordBtn = document.getElementById('record-btn');
    const stopBtn = document.getElementById('stop-btn');
    const dbDisplay = document.getElementById('db-display');
    const progressBar = document.getElementById('progress-bar');
    const statusText = document.getElementById('status');
    const recordStatusText = document.getElementById('record-status');
    
    const modal = document.getElementById('custom-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalMessage = document.getElementById('modal-message');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const modalIcon = document.getElementById('modal-icon');

    startBtn.addEventListener('click', toggleMeasurement);
    recordBtn.addEventListener('click', startRecording);
    stopBtn.addEventListener('click', stopRecording);
    modalCloseBtn.addEventListener('click', closeModal);

    function showModal(title, htmlContent, icon = '📊') {
      modalTitle.textContent = title;
      modalMessage.innerHTML = htmlContent; 
      modalIcon.textContent = icon;
      modal.classList.remove('hidden');
    }

    function closeModal() {
      modal.classList.add('hidden');
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        } catch (err) {
          console.error(`Wake Lock 오류: ${err.message}`);
        }
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    async function toggleMeasurement() {
      if (isMeasuring) {
        if (isRecording) {
          showModal('알림', "<div class='text-center text-gray-300 text-xs'>기록이 진행 중입니다.<br>먼저 '기록 중지' 버튼을 눌러주세요.</div>", '⚠️');
          return;
        }
        stopAudio();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        startLocationWatch();

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        
        analyser.fftSize = 2048;
        microphone.connect(analyser);

        isMeasuring = true;
        await requestWakeLock();

        startBtn.textContent = '측정 중지';
        startBtn.classList.replace('bg-emerald-500', 'bg-red-500');
        startBtn.classList.replace('hover:bg-emerald-600', 'hover:bg-red-600');
        
        statusText.textContent = '실시간 감지 중... (화면 켜짐 유지)';
        statusText.classList.replace('text-gray-400', 'text-emerald-400');
        
        recordStatusText.innerHTML = "<div class='text-center text-emerald-500 py-4 font-bold'>준비 완료. '기록 시작' 버튼을 누르세요.</div>";

        recordBtn.disabled = false;
        recordBtn.className = "flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 px-3 rounded-lg transition duration-200 cursor-pointer text-xs active:scale-95";

        updateDb();
      } catch (err) {
        showModal('권한 오류', "<div class='text-center text-gray-300 text-xs'>마이크/위치 권한이 거부되었습니다.<br>설정에서 권한을 허용해 주세요.</div>", '⚠️');
      }
    }

    function updateDb() {
      if (!isMeasuring) return;

      const bufferLength = analyser.fftSize;
      const dataArray = new Float32Array(bufferLength);
      analyser.getFloatTimeDomainData(dataArray);

      let sumSquares = 0.0;
      for (const amplitude of dataArray) {
        sumSquares += amplitude * amplitude;
      }
      let rms = Math.sqrt(sumSquares / bufferLength);
      let db = 20 * Math.log10(rms);

      if (db === -Infinity || isNaN(db)) db = -100;
      let displayDb = Math.round(db + 100); 
      displayDb = Math.max(0, Math.min(120, displayDb));

      // 메인 화면 좌측 실시간 수치 업데이트
      dbDisplay.innerHTML = `${displayDb} <span class="text-xs font-normal text-gray-500">dB</span>`;
      const percent = (displayDb / 120) * 100;
      progressBar.style.width = `${percent}%`;

      if (displayDb > 80) progressBar.className = "bg-red-500 h-full w-0 transition-all duration-75";
      else if (displayDb > 55) progressBar.className = "bg-yellow-500 h-full w-0 transition-all duration-75";
      else progressBar.className = "bg-emerald-500 h-full w-0 transition-all duration-75";

      // 📊 기록 중일 때 통계 실시간 연산 (배열 없이 무제한 연산)
      if (isRecording && !ignoreClickNoise) {
        const timeStr = new Date().toLocaleTimeString('ko-KR', { hour12: false });

        // 1. 최고치 계산
        if (displayDb > maxDb) {
          maxDb = displayDb;
          maxDbTime = timeStr;
          maxDbLat = currentLat !== null ? currentLat.toFixed(6) : '연결중';
          maxDbLng = currentLng !== null ? currentLng.toFixed(6) : '연결중';
        }
        // 2. 최저치 계산
        if (displayDb < minDb) {
          minDb = displayDb;
          minDbTime = timeStr;
        }
        // 3. 평균치 누적 계산
        totalDbSum += displayDb;
        sampleCount++;
        const avgDb = (totalDbSum / sampleCount).toFixed(1);

        // 4. 경과 시간 계산
        const elapsedSec = Math.floor((performance.now() - recordRealStartTime) / 1000);
        const min = Math.floor(elapsedSec / 60);
        const sec = elapsedSec % 60;
        const durationStr = `${min}분 ${sec}초`;

        // 5. DOM 실시간 가볍게 업데이트
        const eMax = document.getElementById('stat-max');
        const eMaxTime = document.getElementById('stat-max-time');
        const eMin = document.getElementById('stat-min');
        const eMinTime = document.getElementById('stat-min-time');
        const eAvg = document.getElementById('stat-avg');
        const eDuration = document.getElementById('rec-duration');

        if (eMax) eMax.textContent = maxDb;
        if (eMaxTime) eMaxTime.textContent = maxDbTime;
        if (eMin) eMin.textContent = minDb;
        if (eMinTime) eMinTime.textContent = minDbTime;
        if (eAvg) eAvg.textContent = avgDb;
        if (eDuration) eDuration.textContent = durationStr;
      }

      requestAnimationFrame(updateDb);
    }

    function startLocationWatch() {
      if (navigator.geolocation) {
        geoWatchId = navigator.geolocation.watchPosition(
          (position) => {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;
          },
          (error) => { console.error("GPS 오류:", error); },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      }
    }

    function startRecording() {
      isRecording = true;
      maxDb = 0;
      maxDbTime = '-';
      minDb = 999;
      minDbTime = '-';
      totalDbSum = 0;
      sampleCount = 0;
      
      startTime = new Date().toLocaleTimeString('ko-KR');
      recordRealStartTime = performance.now();
      
      ignoreClickNoise = true;
      setTimeout(() => { ignoreClickNoise = false; }, 200);

      // 대시보드 UI 동적 렌더링 (컴팩트 그리드 구조)
      recordStatusText.innerHTML = `
        <div class="grid grid-cols-2 gap-1.5 text-[11px] w-full">
          <div class="col-span-2 flex justify-between border-b border-gray-800 pb-1 text-[10px] text-gray-500 font-mono">
            <div>⏱️ 시작: <span class="text-gray-300 font-bold">${startTime}</span></div>
            <div>⏱️ 경과: <span id="rec-duration" class="text-emerald-400 font-bold">0분 0초</span></div>
          </div>
          
          <!-- 최고 소음 블록 -->
          <div class="bg-gray-900/90 p-1.5 rounded-lg border border-gray-800 flex flex-col justify-between">
            <div class="text-red-400 font-bold text-[10px] flex items-center gap-0.5">🔴 최고 소음</div>
            <div class="text-base font-black text-white my-0.5"><span id="stat-max">-</span> <span class="text-[10px] font-normal text-gray-400">dB</span></div>
            <div class="text-[9px] text-gray-500 font-mono" id="stat-max-time">-</div>
          </div>
          
          <!-- 최저 소음 블록 -->
          <div class="bg-gray-900/90 p-1.5 rounded-lg border border-gray-800 flex flex-col justify-between">
            <div class="text-blue-400 font-bold text-[10px] flex items-center gap-0.5">🔵 최저 소음</div>
            <div class="text-base font-black text-white my-0.5"><span id="stat-min">-</span> <span class="text-[10px] font-normal text-gray-400">dB</span></div>
            <div class="text-[9px] text-gray-500 font-mono" id="stat-min-time">-</div>
          </div>
          
          <!-- 평균 소음 블록 (하단 가로 전면 차지) -->
          <div class="col-span-2 bg-emerald-950/30 p-1.5 rounded-lg border border-emerald-900/40 flex justify-between items-center px-2.5">
            <div class="text-emerald-400 font-bold text-[10px] flex items-center gap-1">🟢 구간 평균 소음</div>
            <div class="text-base font-black text-emerald-400"><span id="stat-avg">-</span> <span class="text-xs font-normal text-gray-400">dB</span></div>
          </div>
        </div>
      `;

      recordBtn.disabled = true;
      recordBtn.className = "flex-1 bg-gray-800 text-gray-600 font-bold py-2.5 px-3 rounded-lg transition duration-200 cursor-not-allowed text-xs";
      
      stopBtn.disabled = false;
      stopBtn.className = "flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2.5 px-3 rounded-lg transition duration-200 cursor-pointer text-xs active:scale-95";
    }

    function stopRecording() {
      if (!isRecording) return;
      isRecording = false;
      endTime = new Date().toLocaleTimeString('ko-KR');
      
      const avgDb = (totalDbSum / sampleCount).toFixed(1);

      // 최종 통계 모달창 오픈
      const resultHtml = `
        <div class="bg-gray-950 p-3 rounded-lg border border-gray-800 space-y-2 font-sans text-xs">
          <div class="flex justify-between text-[10px] text-gray-400 border-b border-gray-800 pb-1.5 font-mono">
            <div>시작: ${startTime}</div>
            <div>종료: ${endTime}</div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <div class="text-red-400 font-bold text-[10px]">👑 최고 기록</div>
              <div class="text-lg font-black text-white mt-0.5">${maxDb} <span class="text-[10px] font-normal text-gray-400">dB</span></div>
              <div class="text-[9px] text-gray-500 font-mono mt-0.5">${maxDbTime}</div>
            </div>
            <div>
              <div class="text-blue-400 font-bold text-[10px]">💤 최저 기록</div>
              <div class="text-lg font-black text-white mt-0.5">${minDb} <span class="text-[10px] font-normal text-gray-400">dB</span></div>
              <div class="text-[9px] text-gray-500 font-mono mt-0.5">${minDbTime}</div>
            </div>
          </div>
          <div class="border-t border-gray-800/60 pt-2 flex justify-between items-center">
            <div class="text-emerald-400 font-bold text-[10px]">📊 전체 평균 소음</div>
            <div class="text-base font-black text-emerald-400">${avgDb} dB</div>
          </div>
          <div class="border-t border-gray-800/60 pt-2">
            <div class="text-gray-500 font-medium text-[9px] uppercase tracking-wider">최고치 발생 위치</div>
            <div class="text-[10px] font-mono text-gray-400 mt-0.5">${maxDbLat}, ${maxDbLng}</div>
          </div>
        </div>
      `;

      showModal('구간 기록 결과', resultHtml, '📊');
      resetRecordButtons();
    }

    function resetRecordButtons() {
      recordBtn.disabled = false;
      recordBtn.className = "flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 px-3 rounded-lg transition duration-200 cursor-pointer text-xs active:scale-95";
      
      stopBtn.disabled = true;
      stopBtn.className = "flex-1 bg-gray-800 text-gray-600 font-bold py-2.5 px-3 rounded-lg transition duration-200 cursor-not-allowed text-xs";
    }

    function stopAudio() {
      isMeasuring = false;
      isRecording = false;
      releaseWakeLock();

      if (audioContext) audioContext.close();
      if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);

      startBtn.textContent = '측정 시작';
      startBtn.className = "w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-extrabold py-2 px-3 rounded-lg transition duration-200 cursor-pointer text-sm active:scale-[0.98]";
      
      statusText.textContent = '측정이 중지되었습니다.';
      statusText.classList.replace('text-emerald-400', 'text-gray-400');

      recordStatusText.innerHTML = "<div class='text-center text-gray-500 py-4'>대기 중... (측정을 시작하면 활성화됩니다.)</div>";
      dbDisplay.innerHTML = `00 <span class="text-xs font-normal text-gray-500">dB</span>`;
      progressBar.style.width = '0%';

      recordBtn.disabled = true;
      recordBtn.className = "flex-1 bg-gray-800 text-gray-600 font-bold py-2.5 px-3 rounded-lg transition duration-200 cursor-not-allowed text-xs";
      stopBtn.disabled = true;
      stopBtn.className = "flex-1 bg-gray-800 text-gray-600 font-bold py-2.5 px-3 rounded-lg transition duration-200 cursor-not-allowed text-xs";
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible' && isMeasuring) {
        await requestWakeLock();
      }
    });
  </script>
</body>
</html>
