<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>실시간 소음(dB) 측정기</title>
  <!-- UI 스타일링을 위한 Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* 캔버스 높이를 스마트폰 화면에 맞춰 슬림하게 고정 */
    #history-canvas {
      width: 100% !important;
      height: 80px !important; 
    }
  </style>
</head>
<body class="bg-gray-950 text-white font-sans select-none min-h-screen flex flex-col justify-start">

  <!-- 타이틀 바 (최상단 밀착) -->
  <header class="bg-gray-900 border-b border-gray-800 py-2 px-3 text-center">
    <h1 class="text-lg font-extrabold text-emerald-400 tracking-tight flex items-center justify-center gap-1">
      <span>🔊</span> 데시벨 측정기
    </h1>
  </header>

  <!-- 메인 컨텐츠 영역 (전체 여백 축소 및 중앙 정렬 해제하여 위로 밀착) -->
  <main class="w-full max-w-md mx-auto p-2 flex flex-col gap-2">
    
    <!-- 상단 영역: 데시벨(좌) + 버튼(우) -->
    <div class="flex items-center gap-2 bg-gray-900 p-2 rounded-xl border border-gray-800 shadow-md">
      <!-- 왼쪽: 실시간 데시벨 (크기 축소) -->
      <div class="relative flex-shrink-0 flex items-center justify-center w-24 h-24 bg-gray-800 rounded-full border-4 border-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.15)]">
        <div id="db-display" class="text-2xl font-black text-emerald-400 tracking-wider">
          00 <span class="text-xs font-normal text-gray-500">dB</span>
        </div>
      </div>

      <!-- 오른쪽: 제어 버튼 및 상태 바 -->
      <div class="flex-grow flex flex-col gap-1.5">
        <button id="start-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-extrabold py-2 px-3 rounded-lg transition duration-200 cursor-pointer text-sm active:scale-[0.98]">
          측정 시작
        </button>
        <p id="status" class="text-gray-400 text-[10px] font-medium leading-tight px-0.5">
          버튼을 누르면 측정이 시작되며 화면이 꺼지지 않습니다.
        </p>
        <div class="w-full bg-gray-800 rounded-full h-2 overflow-hidden p-[1px] border border-gray-700">
          <div id="progress-bar" class="bg-emerald-500 h-full w-0 rounded-full transition-all duration-75"></div>
        </div>
      </div>
    </div>

    <!-- 하단 영역: 기록 및 분석 섹션 (타이트한 배치) -->
    <div class="bg-gray-900 border border-gray-800 p-2 rounded-xl shadow-md flex flex-col">
      <h2 class="text-xs font-bold text-gray-400 mb-1 flex items-center gap-1">
        📊 기록 구간 분석
      </h2>
      
      <!-- 그래프 및 지표 노출 공간 (여백 최소화) -->
      <div id="record-status" class="text-gray-400 mb-2 text-[11px] bg-gray-950 p-2 rounded-lg border border-gray-800 min-h-[45px] flex flex-col justify-center gap-0.5 font-mono leading-tight overflow-hidden">
        대기 중... (측정을 시작하면 활성화됩니다.)
      </div>
      
      <!-- 버튼 위치를 그래프 공간 바로 아래로 밀착 (mt-auto 제거) -->
      <div class="flex gap-2">
        <button id="record-btn" disabled class="flex-1 bg-gray-800 text-gray-600 font-bold py-2.5 px-3 rounded-lg transition duration-200 cursor-not-allowed text-xs">
          기록 시작
        </button>
        <button id="stop-btn" disabled class="flex-1 bg-gray-600 text-gray-400 font-bold py-2.5 px-3 rounded-lg transition duration-200 cursor-not-allowed text-xs">
          기록 중지
        </button>
      </div>
    </div>
  </main>

  <!-- 커스텀 모달 UI -->
  <div id="custom-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl max-w-xs w-full text-center shadow-2xl transform scale-95 transition-transform duration-200">
      <div id="modal-icon" class="text-2xl mb-1">📊</div>
      <h3 id="modal-title" class="text-base font-bold text-white mb-2">측정 결과</h3>
      <div id="modal-message" class="text-xs text-gray-400 mb-4 text-left space-y-2 leading-tight"></div>
      <button id="modal-close-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-bold py-2 px-3 rounded-lg transition cursor-pointer active:scale-95 text-xs">
        확인
      </button>
    </div>
  </div>

  <script>
    // 기존 스크립트 엔진 논리 그대로 유지 (UI 클래스 및 높이 설정만 연동 수정)
    let audioContext;
    let analyser;
    let microphone;
    let isMeasuring = false;
    let wakeLock = null;
    let isRecording = false;
    let maxDb = 0;
    let maxDbTime = '';
    let maxDbLat = '측정중';
    let maxDbLng = '측정중';
    let ignoreClickNoise = false;
    let startTime = '';
    let endTime = '';
    let historyData = [];
    let lastSampleTime = 0;
    let currentLat = null;
    let currentLng = null;
    let geoWatchId = null;

    const startBtn = document.getElementById('start-btn');
    const recordBtn = document.getElementById('record-btn');
    const stopBtn = document.getElementById('stop-btn');
    const dbDisplay = document.getElementById('db-display');
    const progressBar = document.getElementById('progress-bar');
    const statusText = document.getElementById('status');
    const recordStatusText = document.getElementById('record-status');
    
    const modal = document.getElementById('custom-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalMessage = document.getElementById('modal-message');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const modalIcon = document.getElementById('modal-icon');

    startBtn.addEventListener('click', toggleMeasurement);
    recordBtn.addEventListener('click', startRecording);
    stopBtn.addEventListener('click', stopRecording);
    modalCloseBtn.addEventListener('click', closeModal);

    function showModal(title, htmlContent, icon = '📊') {
      modalTitle.textContent = title;
      modalMessage.innerHTML = htmlContent; 
      modalIcon.textContent = icon;
      modal.classList.remove('hidden');
    }

    function closeModal() {
      modal.classList.add('hidden');
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        } catch (err) {
          console.error(`Wake Lock 요청 실패: ${err.name}, ${err.message}`);
        }
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    async function toggleMeasurement() {
      if (isMeasuring) {
        if (isRecording) {
          showModal('알림', "<div class='text-center text-gray-300 text-xs'>기록이 진행 중입니다.<br>먼저 '기록 중지' 버튼을 눌러주세요.</div>", '⚠️');
          return;
        }
        stopAudio();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        startLocationWatch();

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        
        analyser.fftSize = 2048;
        microphone.connect(analyser);

        isMeasuring = true;
        await requestWakeLock();

        startBtn.textContent = '측정 중지';
        startBtn.classList.replace('bg-emerald-500', 'bg-red-500');
        startBtn.classList.replace('hover:bg-emerald-600', 'hover:bg-red-600');
        
        statusText.textContent = '실시간 감지 중... (화면 켜짐 유지)';
        statusText.classList.replace('text-gray-400', 'text-emerald-400');
        
        recordStatusText.innerHTML = "준비 완료. '기록 시작'을 누르면 그래프가 활성화됩니다.";

        recordBtn.disabled = false;
        recordBtn.className = "flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 px-3 rounded-lg transition duration-200 cursor-pointer text-xs active:scale-95";

        updateDb();
      } catch (err) {
        showModal('권한 오류', "<div class='text-center text-gray-300 text-xs'>마이크/위치 권한이 거부되었습니다.<br>설정에서 권한을 허용해 주세요.</div>", '⚠️');
        console.error(err);
      }
    }

    function updateDb() {
      if (!isMeasuring) return;

      const bufferLength = analyser.fftSize;
      const dataArray = new Float32Array(bufferLength);
      analyser.getFloatTimeDomainData(dataArray);

      let sumSquares = 0.0;
      for (const amplitude of dataArray) {
        sumSquares += amplitude * amplitude;
      }
      let rms = Math.sqrt(sumSquares / bufferLength);
      let db = 20 * Math.log10(rms);

      if (db === -Infinity || isNaN(db)) db = -100;
      let displayDb = Math.round(db + 100); 
      displayDb = Math.max(0, Math.min(120, displayDb));

      dbDisplay.innerHTML = `${displayDb} <span class="text-xs font-normal text-gray-500">dB</span>`;
      const percent = (displayDb / 120) * 100;
      progressBar.style.width = `${percent}%`;

      if (displayDb > 80) progressBar.className = "bg-red-500 h-full w-0 transition-all duration-75";
      else if (displayDb > 55) progressBar.className = "bg-yellow-500 h-full w-0 transition-all duration-75";
      else progressBar.className = "bg-emerald-500 h-full w-0 transition-all duration-75";

      if (isRecording && !ignoreClickNoise) {
        if (displayDb > maxDb) {
          maxDb = displayDb;
          maxDbTime = new Date().toLocaleTimeString('ko-KR');
          maxDbLat = currentLat !== null ? currentLat.toFixed(6) : '연결중';
          maxDbLng = currentLng !== null ? currentLng.toFixed(6) : '연결중';
          
          const pDb = document.getElementById('peak-db');
          const pGeo = document.getElementById('peak-geo');
          if (pDb) pDb.textContent = `${maxDb} dB`;
          if (pGeo) pGeo.textContent = `${maxDbLat}, ${maxDbLng}`;
        }
        
        const now = performance.now();
        if (now - lastSampleTime >= 200) {
          lastSampleTime = now;
          historyData.push({
            db: displayDb,
            time: new Date().toLocaleTimeString('ko-KR'),
            lat: currentLat !== null ? currentLat.toFixed(6) : '연결중',
            lng: currentLng !== null ? currentLng.toFixed(6) : '연결중'
          });
          drawHistoryGraph();
        }
      }

      requestAnimationFrame(updateDb);
    }

    function drawHistoryGraph() {
      const canvasH = document.getElementById('history-canvas');
      if (!canvasH) return;
      const ctxH = canvasH.getContext('2d');
      
      const w = 600;
      const h = 160; // 캔버스 내부 높이 최적화
      ctxH.clearRect(0, 0, w, h);

      const len = historyData.length;
      if (len === 0) return;

      let step = 4;
      if (len * 4 > w) {
        step = w / len;
      }
      const barWidth = Math.max(1, step - 0.5);

      let localMaxDb = -1;
      let maxIndex = -1;
      for (let i = 0; i < len; i++) {
        if (historyData[i].db > localMaxDb) {
          localMaxDb = historyData[i].db;
          maxIndex = i;
        }
      }

      for (let i = 0; i < len; i++) {
        const item = historyData[i];
        const maxGraphH = 120; 
        const barH = (item.db / 120) * maxGraphH;
        const x = i * step;
        const y = h - barH;

        if (i === maxIndex && localMaxDb > 0) ctxH.fillStyle = '#ef4444'; 
        else if (item.db > 80) ctxH.fillStyle = '#f87171';
        else if (item.db > 55) ctxH.fillStyle = '#fbbf24';
        else ctxH.fillStyle = '#34d399';
        
        ctxH.fillRect(x, y, barWidth, barH);
      }

      if (maxIndex !== -1 && localMaxDb > 0) {
        const peakItem = historyData[maxIndex];
        const peakX = maxIndex * step + barWidth / 2;
        const peakY = h - (peakItem.db / 120) * 120;

        ctxH.strokeStyle = 'rgba(239, 68, 68, 0.7)';
        ctxH.lineWidth = 1.5;
        ctxH.setLineDash([4, 4]);
        ctxH.beginPath();
        ctxH.moveTo(peakX, peakY);
        ctxH.lineTo(peakX, 25);
        ctxH.stroke();
        ctxH.setLineDash([]); 

        ctxH.fillStyle = '#ef4444';
        ctxH.beginPath();
        ctxH.moveTo(peakX, 25);
        ctxH.lineTo(peakX - 5, 17);
        ctxH.lineTo(peakX + 5, 17);
        ctxH.fill();

        ctxH.fillStyle = '#f87171';
        ctxH.font = 'bold 12px sans-serif';
        ctxH.textAlign = peakX > w - 80 ? 'right' : (peakX < 80 ? 'left' : 'center');
        ctxH.fillText(`MAX: ${peakItem.db}dB`, peakX, 12);
      }
    }

    function startLocationWatch() {
      if (navigator.geolocation) {
        geoWatchId = navigator.geolocation.watchPosition(
          (position) => {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;
          },
          (error) => { console.error("GPS 오류:", error); },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      }
    }

    function startRecording() {
      isRecording = true;
      maxDb = 0; 
      maxDbTime = '-';
      maxDbLat = '측정중';
      maxDbLng = '측정중';
      
      startTime = new Date().toLocaleTimeString('ko-KR');
      endTime = '';
      historyData = [];
      lastSampleTime = performance.now();
      
      ignoreClickNoise = true;
      setTimeout(() => { ignoreClickNoise = false; }, 200);

      recordStatusText.innerHTML = `
        <div class="flex justify-between text-[10px] text-gray-500 mb-1 font-sans px-0.5">
          <div>⏱️ 시작: <span id="rec-start-time" class="text-gray-300 font-bold">${startTime}</span></div>
          <div>⏱️ 종료: <span id="rec-end-time" class="text-gray-500 font-medium">진행 중...</span></div>
        </div>
        
        <div id="rec-peak-info" class="text-[10px] text-gray-400 bg-gray-900/60 p-1.5 rounded-md border border-gray-800 mb-1.5 space-y-0.5 font-sans">
          <div class="flex justify-between"><span class="text-red-400 font-bold">🔴 최고치:</span> <span id="peak-db" class="text-white font-bold">- dB</span></div>
          <div class="flex justify-between"><span>📍 위치:</span> <span id="peak-geo" class="text-gray-300 text-[9px]">-</span></div>
        </div>

        <div class="relative w-full bg-gray-950 rounded-md overflow-hidden border border-gray-850 p-0.5 flex items-center justify-center">
          <canvas id="history-canvas" width="600" height="160" class="block bg-gray-950"></canvas>
        </div>
      `;

      recordBtn.disabled = true;
      recordBtn.className = "flex-1 bg-gray-800 text-gray-600 font-bold py-2.5 px-3 rounded-lg transition duration-200 cursor-not-allowed text-xs";
      
      stopBtn.disabled = false;
      stopBtn.className = "flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2.5 px-3 rounded-lg transition duration-200 cursor-pointer text-xs active:scale-95";
    }

    function stopRecording() {
      if (!isRecording) return;
      isRecording = false;
      endTime = new Date().toLocaleTimeString('ko-KR');

      const recEndTimeEl = document.getElementById('rec-end-time');
      if (recEndTimeEl) {
        recEndTimeEl.textContent = endTime;
        recEndTimeEl.className = "text-white font-bold";
      }

      drawHistoryGraph();

      const resultHtml = `
        <div class="bg-gray-950 p-3 rounded-lg border border-gray-800 space-y-2 font-sans text-xs">
          <div class="flex justify-between text-[10px] text-gray-400 border-b border-gray-800 pb-1.5">
            <div>시작: ${startTime}</div>
            <div>종료: ${endTime}</div>
          </div>
          <div>
            <div class="text-gray-500 font-medium text-[9px] uppercase tracking-wider">최고 기록</div>
            <div class="text-xl font-black text-emerald-400 mt-0.5">${maxDb} <span class="text-xs font-normal text-gray-400">dB</span></div>
          </div>
          <div class="border-t border-gray-800/60 pt-1.5">
            <div class="text-gray-500 font-medium text-[9px] uppercase tracking-wider">최고치 발생 시간</div>
            <div class="text-xs font-bold text-white mt-0.5">${maxDbTime}</div>
          </div>
          <div class="border-t border-gray-800/60 pt-1.5">
            <div class="text-gray-500 font-medium text-[9px] uppercase tracking-wider">최고치 발생 위치</div>
            <div class="text-[11px] font-medium text-gray-400 mt-0.5">${maxDbLat}, ${maxDbLng}</div>
          </div>
        </div>
      `;

      showModal('기록 완료', resultHtml, '📊');
      resetRecordButtons();
    }

    function resetRecordButtons() {
      recordBtn.disabled = false;
      recordBtn.className = "flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 px-3 rounded-lg transition duration-200 cursor-pointer text-xs active:scale-95";
      
      stopBtn.disabled = true;
      stopBtn.className = "flex-1 bg-gray-800 text-gray-600 font-bold py-2.5 px-3 rounded-lg transition duration-200 cursor-not-allowed text-xs";
    }

    function stopAudio() {
      isMeasuring = false;
      isRecording = false;
      releaseWakeLock();

      if (audioContext) audioContext.close();
      if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);

      startBtn.textContent = '측정 시작';
      startBtn.className = "w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-extrabold py-2 px-3 rounded-lg transition duration-200 cursor-pointer text-sm active:scale-[0.98]";
      
      statusText.textContent = '측정이 중지되었습니다.';
      statusText.classList.replace('text-emerald-400', 'text-gray-400');

      recordStatusText.textContent = '대기 중... (측정을 시작하면 활성화됩니다.)';
      dbDisplay.innerHTML = `00 <span class="text-xs font-normal text-gray-500">dB</span>`;
      progressBar.style.width = '0%';

      recordBtn.disabled = true;
      recordBtn.className = "flex-1 bg-gray-800 text-gray-600 font-bold py-2.5 px-3 rounded-lg transition duration-200 cursor-not-allowed text-xs";
      stopBtn.disabled = true;
      stopBtn.className = "flex-1 bg-gray-800 text-gray-600 font-bold py-2.5 px-3 rounded-lg transition duration-200 cursor-not-allowed text-xs";
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible' && isMeasuring) {
        await requestWakeLock();
      }
    });
  </script>
</body>
</html>
