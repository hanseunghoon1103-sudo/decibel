<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>실시간 데시벨위치 기록기</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen font-sans p-4">

  <div class="bg-gray-800 p-6 rounded-2xl shadow-2xl text-center max-w-sm w-full mx-4">
    <h1 class="text-2xl font-bold mb-4 text-emerald-400">🔊 데시벨 위치 기록기</h1>
    
    <div class="relative flex items-center justify-center w-40 h-40 mx-auto mb-4 bg-gray-700 rounded-full border-4 border-emerald-500">
      <div id="db-display" class="text-4xl font-black text-emerald-400">00 <span class="text-lg font-normal text-gray-400">dB</span></div>
    </div>

    <p id="status" class="text-gray-400 mb-2 text-xs">아래 '측정 시작' 버튼을 누르면 마이크/GPS 권한을 요청합니다.</p>
    <div class="w-full bg-gray-700 rounded-full h-3 mb-4 overflow-hidden">
      <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-75"></div>
    </div>

    <button id="start-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold py-2 px-4 rounded-xl transition duration-200 cursor-pointer text-base mb-4">
      측정 시작 (마이크/GPS 켜기)
    </button>

    <div class="border-t border-gray-700 pt-4 my-2">
      <h2 class="text-sm font-semibold text-gray-300 mb-2 text-left">📊 스프레드시트 저장 관리</h2>
      
      <div id="record-status" class="text-gray-400 mb-4 text-xs text-left bg-gray-900 p-3 rounded-xl border border-gray-700 min-h-[72px] flex flex-col justify-center gap-0.5">
        대기 중... (마이크를 켜면 활성화됩니다.)
      </div>
      
      <div class="flex gap-2">
        <button id="record-btn" disabled class="flex-1 bg-gray-600 text-gray-400 font-bold py-2 px-4 rounded-xl transition duration-200 cursor-not-allowed">
          기록 시작
        </button>
        <button id="stop-btn" disabled class="flex-1 bg-gray-600 text-gray-400 font-bold py-2 px-4 rounded-xl transition duration-200 cursor-not-allowed">
          중지 (시트 전송)
        </button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ 1단계에서 복사한 구글 앱스 크립트의 웹앱 웹 주소(URL)를 아래 따옴표 안에 붙여넣으세요!
    const GAS_WEBAPP_URL = "YOUR_GAS_WEB_APP_URL_HERE";

    let audioContext;
    let analyser;
    let microphone;
    let isMeasuring = false;

    let isRecording = false;
    let maxDb = 0;
    let maxDbTime = '';
    let maxDbLat = '확인 불가';
    let maxDbLng = '확인 불가';

    let currentLat = null;
    let currentLng = null;
    let geoWatchId = null;

    const startBtn = document.getElementById('start-btn');
    const recordBtn = document.getElementById('record-btn');
    const stopBtn = document.getElementById('stop-btn');
    const dbDisplay = document.getElementById('db-display');
    const progressBar = document.getElementById('progress-bar');
    const statusText = document.getElementById('status');
    const recordStatusText = document.getElementById('record-status');

    startBtn.addEventListener('click', toggleMeasurement);
    recordBtn.addEventListener('click', startRecording);
    stopBtn.addEventListener('click', stopRecording);

    async function toggleMeasurement() {
      if (isMeasuring) {
        if (isRecording) {
          alert("기록이 진행 중입니다. 먼저 '중지' 버튼을 눌러 시트에 저장해 주세요.");
          return;
        }
        stopAudio();
        return;
      }

      try {
        // 깃허브 페이지 도메인에서는 아래 권한 팝업이 즉시 정상 작동합니다!
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        startLocationWatch();

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        
        analyser.fftSize = 2048;
        microphone.connect(analyser);

        isMeasuring = true;
        startBtn.textContent = '측정 중지';
        startBtn.classList.replace('bg-emerald-500', 'bg-red-500');
        startBtn.classList.replace('hover:bg-emerald-600', 'hover:bg-red-600');
        statusText.textContent = '실시간 소리 감지 중...';
        recordStatusText.innerHTML = "준비 완료. '기록 시작' 버튼을 누르면 피크 소음 추적을 시작합니다.";

        recordBtn.disabled = false;
        recordBtn.className = "flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-xl transition duration-200 cursor-pointer";

        updateDb();
      } catch (err) {
        alert('마이크 또는 위치 정보 권한 팝업이 거부되었거나 차단되었습니다.');
        console.error(err);
      }
    }

    function updateDb() {
      if (!isMeasuring) return;

      const bufferLength = analyser.fftSize;
      const dataArray = new Float32Array(bufferLength);
      analyser.getFloatTimeDomainData(dataArray);

      let sumSquares = 0.0;
      for (const amplitude of dataArray) {
        sumSquares += amplitude * amplitude;
      }
      let rms = Math.sqrt(sumSquares / bufferLength);
      let db = 20 * Math.log10(rms);

      if (db === -Infinity || isNaN(db)) db = -100;
      let displayDb = Math.round(db + 100); 
      displayDb = Math.max(0, Math.min(120, displayDb));

      dbDisplay.innerHTML = `${displayDb} <span class="text-lg font-normal text-gray-400">dB</span>`;
      const percent = (displayDb / 120) * 100;
      progressBar.style.width = `${percent}%`;

      if (displayDb > 80) progressBar.className = "bg-red-500 h-full w-0 transition-all duration-75";
      else if (displayDb > 55) progressBar.className = "bg-yellow-500 h-full w-0 transition-all duration-75";
      else progressBar.className = "bg-emerald-500 h-full w-0 transition-all duration-75";

      if (isRecording) {
        if (displayDb > maxDb) {
          maxDb = displayDb;
          maxDbTime = new Date().toLocaleString('ko-KR');
          maxDbLat = currentLat !== null ? currentLat.toFixed(6) : '위치 측정중';
          maxDbLng = currentLng !== null ? currentLng.toFixed(6) : '위치 측정중';
          
          recordStatusText.innerHTML = `
            <div>🔴 <b>구간 최고치 추적 중...</b></div>
            <div>• 최고 데시벨: <span class="text-emerald-400 font-bold">${maxDb} dB</span></div>
            <div>• 기록일시: ${maxDbTime}</div>
            <div>• 기록위치: ${maxDbLat}, ${maxDbLng}</div>
          `;
        }
      }

      requestAnimationFrame(updateDb);
    }

    function startLocationWatch() {
      if (navigator.geolocation) {
        geoWatchId = navigator.geolocation.watchPosition(
          (position) => {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;
          },
          (error) => { console.error("GPS 오류:", error); },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      }
    }

    function startRecording() {
      isRecording = true;
      maxDb = 0; 
      maxDbTime = '데이터 없음';
      recordStatusText.innerHTML = `🔴 <b>구간 최고치 추적 중...</b><br>소리를 내어 보세요!`;

      recordBtn.disabled = true;
      recordBtn.className = "flex-1 bg-gray-600 text-gray-400 font-bold py-2 px-4 rounded-xl transition duration-200 cursor-not-allowed";
      stopBtn.disabled = false;
      stopBtn.className = "flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-xl transition duration-200 cursor-pointer";
    }

    // 🚀 핵심 변경부: fetch를 사용해 구글 API로 데이터 전송
    function stopRecording() {
      if (!isRecording) return;
      isRecording = false;

      recordStatusText.innerHTML = `⏳ <b>스프레드시트에 저장 중...</b><br>데이터 전송 요청 중`;
      stopBtn.disabled = true;
      stopBtn.className = "flex-1 bg-gray-600 text-gray-400 font-bold py-2 px-4 rounded-xl transition duration-200 cursor-not-allowed";

      if (GAS_WEBAPP_URL === "YOUR_GAS_WEB_APP_URL_HERE") {
        alert("코드 내부의 GAS_WEBAPP_URL 주소를 본인의 주소로 변경해 주셔야 시트에 저장됩니다.");
        resetRecordButtons();
        return;
      }

      // 구글 앱스 크립트 API에 POST 방식으로 전송 (CORS 프리플라이트 회피를 위해 text/plain 규격 사용)
      fetch(GAS_WEBAPP_URL, {
        method: "POST",
        mode: "no-cors", // CORS 정책 우회 (구글 스크립트 전용 방식)
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          maxDb: maxDb,
          dateTime: maxDbTime,
          lat: maxDbLat,
          lng: maxDbLng
        })
      })
      .then(() => {
        // no-cors 모드는 성공 응답 본문을 읽을 수 없으므로, 전송 시도가 끝나면 성공 처리합니다.
        recordStatusText.innerHTML = `✅ <b>저장 요청 완료!</b><br>구간 최고인 <b>${maxDb} dB</b> 데이터가 구글 시트에 전송되었습니다. 잠시 후 시트를 확인해 보세요.`;
        resetRecordButtons();
      })
      .catch((err) => {
        recordStatusText.innerHTML = `❌ <b>전송 실패:</b><br>${err.message}`;
        resetRecordButtons();
      });
    }

    function resetRecordButtons() {
      recordBtn.disabled = false;
      recordBtn.className = "flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-xl transition duration-200 cursor-pointer";
    }

    function stopAudio() {
      isMeasuring = false;
      isRecording = false;
      if (audioContext) audioContext.close();
      if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);

      startBtn.textContent = '측정 시작 (마이크/GPS 켜기)';
      startBtn.className = "w-full bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold py-2 px-4 rounded-xl transition duration-200 cursor-pointer mb-4";
      statusText.textContent = '측정이 중지되었습니다.';
      recordStatusText.textContent = '대기 중... (마이크를 켜면 활성화됩니다.)';
      dbDisplay.innerHTML = `00 <span class="text-lg font-normal text-gray-400">dB</span>`;
      progressBar.style.width = '0%';

      recordBtn.disabled = true;
      recordBtn.className = "flex-1 bg-gray-600 text-gray-400 font-bold py-2 px-4 rounded-xl transition duration-200 cursor-not-allowed";
      stopBtn.disabled = true;
      stopBtn.className = "flex-1 bg-gray-600 text-gray-400 font-bold py-2 px-4 rounded-xl transition duration-200 cursor-not-allowed";
    }
  </script>
</body>
</html>
