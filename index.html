<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>실시간 소음(dB) 측정기</title>
  <!-- UI 스타일링을 위한 Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-gray-950 text-white flex items-center justify-center min-h-screen font-sans p-4 select-none">

  <!-- 전체 컨테이너 -->
  <div class="bg-gray-900 border border-gray-800 p-6 rounded-3xl shadow-2xl text-center w-full max-w-md flex flex-col justify-between min-h-[80vh] sm:min-h-0">
    
    <div>
      <h1 class="text-2xl font-extrabold mb-6 text-emerald-400 tracking-tight flex items-center justify-center gap-2">
        <span>🔊</span> 데시벨 측정기
      </h1>
      
      <!-- 데시벨 표시부 -->
      <div class="relative flex items-center justify-center w-44 h-44 mx-auto mb-6 bg-gray-800 rounded-full border-4 border-emerald-500 shadow-[0_0_20px_rgba(16,185,129,0.2)]">
        <div id="db-display" class="text-5xl font-black text-emerald-400 tracking-wider">00 <span class="text-xl font-normal text-gray-500">dB</span></div>
      </div>

      <!-- 상태 메시지 및 바 그래프 -->
      <!-- 📌 아이폰 가이드 멘트 수정 -->
      <p id="status" class="text-gray-400 mb-3 text-xs font-medium">아래 버튼을 누르면 측정이 시작되며 화면이 꺼지지 않습니다.</p>
      <div class="w-full bg-gray-800 rounded-full h-4 mb-6 overflow-hidden p-[2px] border border-gray-700">
        <div id="progress-bar" class="bg-emerald-500 h-full w-0 rounded-full transition-all duration-75"></div>
      </div>
    </div>

    <!-- 제어 및 기록 섹션 -->
    <div class="space-y-4">
      <button id="start-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-black py-4 px-6 rounded-2xl transition duration-200 cursor-pointer text-lg active:scale-[0.98]">
        측정 시작 (마이크/GPS 켜기)
      </button>

      <!-- 기록 구간 중 최고치 섹션 -->
      <div class="border-t border-gray-800 pt-4 text-left">
        <h2 class="text-sm font-bold text-gray-400 mb-2 flex items-center gap-1.5">
          📊 기록 구간 중 최고치
        </h2>
        
        <div id="record-status" class="text-gray-400 mb-4 text-xs bg-gray-950 p-4 rounded-2xl border border-gray-800 min-h-[90px] flex flex-col justify-center gap-1 font-mono leading-relaxed">
          대기 중... (측정을 시작하면 활성화됩니다.)
        </div>
        
        <div class="flex gap-3">
          <button id="record-btn" disabled class="flex-1 bg-gray-800 text-gray-600 font-bold py-3.5 px-4 rounded-xl transition duration-200 cursor-not-allowed text-sm">
            기록 시작
          </button>
          <button id="stop-btn" disabled class="flex-1 bg-gray-600 text-gray-400 font-bold py-3.5 px-4 rounded-xl transition duration-200 cursor-not-allowed text-sm">
            기록 중지
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 🚨 커스텀 모달 UI -->
  <div id="custom-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl max-w-xs w-full text-center shadow-2xl transform scale-95 transition-transform duration-200">
      <div id="modal-icon" class="text-3xl mb-1">📊</div>
      <h3 id="modal-title" class="text-lg font-bold text-white mb-4">측정 결과</h3>
      <div id="modal-message" class="text-xs text-gray-400 mb-6 text-left space-y-3 leading-relaxed"></div>
      <button id="modal-close-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-bold py-2.5 px-4 rounded-xl transition cursor-pointer active:scale-95 text-sm">
        확인
      </button>
    </div>
  </div>

  <script>
    let audioContext;
    let analyser;
    let microphone;
    let isMeasuring = false;

    // 📌 1. 화면 꺼짐 방지(Wake Lock) 변수 추가
    let wakeLock = null;

    let isRecording = false;
    let maxDb = 0;
    let maxDbTime = '';
    let maxDbLat = '측정중';
    let maxDbLng = '측정중';
    let ignoreClickNoise = false;

    let currentLat = null;
    let currentLng = null;
    let geoWatchId = null;

    const startBtn = document.getElementById('start-btn');
    const recordBtn = document.getElementById('record-btn');
    const stopBtn = document.getElementById('stop-btn');
    const dbDisplay = document.getElementById('db-display');
    const progressBar = document.getElementById('progress-bar');
    const statusText = document.getElementById('status');
    const recordStatusText = document.getElementById('record-status');
    
    const modal = document.getElementById('custom-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalMessage = document.getElementById('modal-message');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const modalIcon = document.getElementById('modal-icon');

    startBtn.addEventListener('click', toggleMeasurement);
    recordBtn.addEventListener('click', startRecording);
    stopBtn.addEventListener('click', stopRecording);
    modalCloseBtn.addEventListener('click', closeModal);

    function showModal(title, htmlContent, icon = '📊') {
      modalTitle.textContent = title;
      modalMessage.innerHTML = htmlContent; 
      modalIcon.textContent = icon;
      modal.classList.remove('hidden');
    }

    function closeModal() {
      modal.classList.add('hidden');
    }

    // 📌 2. 화면 꺼짐 방지 요청 함수 정의
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          console.log('초절전 기능 가동: 화면 꺼짐 방지 중 💡');
          
          // 사용자가 탭을 바꾸거나 앱을 내려놓으면 lock이 자동으로 해제됨.
          // 다시 돌아왔을 때를 대비해 해제 이벤트 리스너 등록
          wakeLock.addEventListener('release', () => {
            console.log('화면 꺼짐 방지 기능이 해제되었습니다.');
            wakeLock = null;
          });
        } catch (err) {
          console.error(`Wake Lock 요청 실패: ${err.name}, ${err.message}`);
        }
      } else {
        console.warn('이 브라우저는 Wake Lock API를 지원하지 않습니다.');
      }
    }

    // 📌 3. 화면 꺼짐 방지 해제 함수 정의
    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release()
          .then(() => {
            wakeLock = null;
          });
      }
    }

    async function toggleMeasurement() {
      if (isMeasuring) {
        if (isRecording) {
          showModal('알림', "<div class='text-center text-gray-300'>기록이 진행 중입니다.<br>먼저 '기록 중지' 버튼을 눌러주세요.</div>", '⚠️');
          return;
        }
        stopAudio();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        startLocationWatch();

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        
        analyser.fftSize = 2048;
        microphone.connect(analyser);

        isMeasuring = true;

        // 📌 4. 측정 시작 시 화면 꺼짐 방지 요청 (사용자 gesture 이벤트 안에서 실행 필수)
        await requestWakeLock();

        startBtn.textContent = '측정 중지';
        startBtn.classList.replace('bg-emerald-500', 'bg-red-500');
        startBtn.classList.replace('hover:bg-emerald-600', 'hover:bg-red-600');
        
        // 📌 멘트 수정
        statusText.textContent = '실시간 소리 감지 중... (화면이 꺼지지 않습니다)';
        statusText.classList.replace('text-gray-400', 'text-emerald-400');
        
        recordStatusText.innerHTML = "준비 완료. '기록 시작' 버튼을 누르면 피크 소음 추적을 시작합니다.";

        recordBtn.disabled = false;
        recordBtn.className = "flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3.5 px-4 rounded-xl transition duration-200 cursor-pointer text-sm active:scale-95";

        updateDb();
      } catch (err) {
        showModal('권한 오류', "<div class='text-center text-gray-300'>마이크 또는 위치 정보(GPS) 권한 요청이 거부되었습니다.<br>브라우저 설정에서 권한을 허용해 주세요.</div>", '⚠️');
        console.error(err);
      }
    }

    function updateDb() {
      if (!isMeasuring) return;

      const bufferLength = analyser.fftSize;
      const dataArray = new Float32Array(bufferLength);
      analyser.getFloatTimeDomainData(dataArray);

      let sumSquares = 0.0;
      for (const amplitude of dataArray) {
        sumSquares += amplitude * amplitude;
      }
      let rms = Math.sqrt(sumSquares / bufferLength);
      let db = 20 * Math.log10(rms);

      if (db === -Infinity || isNaN(db)) db = -100;
      let displayDb = Math.round(db + 100); 
      displayDb = Math.max(0, Math.min(120, displayDb));

      dbDisplay.innerHTML = `${displayDb} <span class="text-xl font-normal text-gray-500">dB</span>`;
      const percent = (displayDb / 120) * 100;
      progressBar.style.width = `${percent}%`;

      if (displayDb > 80) progressBar.className = "bg-red-500 h-full w-0 transition-all duration-75";
      else if (displayDb > 55) progressBar.className = "bg-yellow-500 h-full w-0 transition-all duration-75";
      else progressBar.className = "bg-emerald-500 h-full w-0 transition-all duration-75";

      if (isRecording && !ignoreClickNoise) {
        if (displayDb > maxDb) {
          maxDb = displayDb;
          maxDbTime = new Date().toLocaleTimeString('ko-KR');
          maxDbLat = currentLat !== null ? currentLat.toFixed(6) : '연결중';
          maxDbLng = currentLng !== null ? currentLng.toFixed(6) : '연결중';
        }
        
        recordStatusText.innerHTML = `
          <div class="text-emerald-400 font-bold flex items-center gap-1">🔴 실시간 최고치 추적 중</div>
          <div>• 최고 소음: <span class="text-white font-bold text-sm">${maxDb} dB</span></div>
          <div>• 발생 시간: <span class="text-gray-300">${maxDbTime}</span></div>
          <div>• 발생 위치: <span class="text-gray-300">${maxDbLat}, ${maxDbLng}</span></div>
        `;
      }

      requestAnimationFrame(updateDb);
    }

    function startLocationWatch() {
      if (navigator.geolocation) {
        geoWatchId = navigator.geolocation.watchPosition(
          (position) => {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;
          },
          (error) => { console.error("GPS 오류:", error); },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      }
    }

    function startRecording() {
      isRecording = true;
      maxDb = 0; 
      maxDbTime = '계산 중...';
      
      ignoreClickNoise = true;
      setTimeout(() => { ignoreClickNoise = false; }, 200);

      recordStatusText.innerHTML = `<div class="text-blue-400 animate-pulse">🔴 최고치 측정 시작... 소리를 내보세요!</div>`;

      recordBtn.disabled = true;
      recordBtn.className = "flex-1 bg-gray-800 text-gray-600 font-bold py-3.5 px-4 rounded-xl transition duration-200 cursor-not-allowed text-sm";
      
      stopBtn.disabled = false;
      stopBtn.className = "flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3.5 px-4 rounded-xl transition duration-200 cursor-pointer text-sm active:scale-95";
    }

    function stopRecording() {
      if (!isRecording) return;
      isRecording = false;

      const resultHtml = `
        <div class="bg-gray-950 p-4 rounded-xl border border-gray-800 space-y-3">
          <div>
            <div class="text-gray-500 font-medium text-[10px] uppercase tracking-wider">최고 기록</div>
            <div class="text-2xl font-black text-emerald-400 mt-0.5">${maxDb} <span class="text-sm font-normal text-gray-400">dB</span></div>
          </div>
          <div class="border-t border-gray-800/60 pt-2">
            <div class="text-gray-500 font-medium text-[10px] uppercase tracking-wider">발생 시간</div>
            <div class="text-sm font-bold text-white mt-0.5">${maxDbTime}</div>
          </div>
          <div class="border-t border-gray-800/60 pt-2">
            <div class="text-gray-500 font-medium text-[10px] uppercase tracking-wider">발생 위치</div>
            <div class="text-xs font-medium text-gray-400 mt-0.5">${maxDbLat}, ${maxDbLng}</div>
          </div>
        </div>
      `;

      showModal('기록 완료', resultHtml, '📊');

      recordStatusText.innerHTML = `
        <div class="text-yellow-400 font-bold">⏹️ 이전 구간 최종 측정치</div>
        <div>• 최고 소음: <span class="text-white font-bold">${maxDb} dB</span></div>
        <div>• 발생 시간: ${maxDbTime}</div>
      `;
      
      resetRecordButtons();
    }

    function resetRecordButtons() {
      recordBtn.disabled = false;
      recordBtn.className = "flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3.5 px-4 rounded-xl transition duration-200 cursor-pointer text-sm active:scale-95";
      
      stopBtn.disabled = true;
      stopBtn.className = "flex-1 bg-gray-800 text-gray-600 font-bold py-3.5 px-4 rounded-xl transition duration-200 cursor-not-allowed text-sm";
    }

    function stopAudio() {
      isMeasuring = false;
      isRecording = false;

      // 📌 5. 측정 중지 시 화면 꺼짐 방지 해제
      releaseWakeLock();

      if (audioContext) audioContext.close();
      if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);

      startBtn.textContent = '측정 시작 (마이크/GPS 켜기)';
      startBtn.className = "w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-black py-4 px-6 rounded-2xl transition duration-200 cursor-pointer text-lg active:scale-[0.98]";
      
      statusText.textContent = '측정이 중지되었습니다.';
      statusText.classList.replace('text-emerald-400', 'text-gray-400');

      recordStatusText.textContent = '대기 중... (측정을 시작하면 활성화됩니다.)';
      dbDisplay.innerHTML = `00 <span class="text-xl font-normal text-gray-500">dB</span>`;
      progressBar.style.width = '0%';

      recordBtn.disabled = true;
      recordBtn.className = "flex-1 bg-gray-800 text-gray-600 font-bold py-3.5 px-4 rounded-xl transition duration-200 cursor-not-allowed text-sm";
      stopBtn.disabled = true;
      stopBtn.className = "flex-1 bg-gray-800 text-gray-600 font-bold py-3.5 px-4 rounded-xl transition duration-200 cursor-not-allowed text-sm";
    }

    // 📌 6. [중요] 사용자가 다른 앱으로 나갔다 돌아왔을 때 Wake Lock 재요청 처리
    // iOS 사파리는 탭이 비활성화되면 Wake Lock을 자동으로 해제합니다.
    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible' && isMeasuring) {
        await requestWakeLock();
      }
    });

  </script>
</body>
</html>
